apiVersion: v1
kind: ConfigMap
metadata:
  name: ellington-web-config
  namespace: ellington
data:
  # Non-secret env consumed by Django (see app/ellington_web/ellington_web/settings/django_settings.py).
  # SQL_PASSWORD is kept separately in the ellington-web-postgres Secret.
  DJANGO_SETTINGS_MODULE: "ellington_web.settings"
  ELLINGTON_WEB_VERSION: "0.0.0"
  DEBUG: "0"
  # With the authentik-forwardauth middleware removed from
  # base/ingressroute.yaml (#14), no Authentik headers reach the
  # upstream. Setting this to "1" while the gate is off would let any
  # external client spoof X-authentik-username and authenticate as
  # anyone. sub-2b's middleware no-ops cleanly when this is "0".
  AUTHENTIK_HEADER_TRUST: "0"
  SQL_ENGINE: "django.contrib.gis.db.backends.postgis"
  SQL_HOST: "db-postgis-master.default.svc.cluster.local"
  SQL_PORT: "5432"
  SQL_DATABASE: "ellington_web"
  SQL_USER: "ellington_web"
  # Django 4.0+ rejects POSTs whose Origin host isn't here.
  # Comma-separated, scheme-included.
  CSRF_TRUSTED_ORIGINS: "https://ellington.siegeanalytics.com"
  # Email — DreamHost SMTP per ellington-web #101. Password lives in
  # the ellington-web-email Secret (separate file because rotation has
  # different cadence + risk profile than other env). Sender mailbox
  # is shared with resume-generator product; rotating the password
  # requires updating BOTH this product's Secret and resume-generator's
  # email Secret in the resume-generator namespace, then rolling-restart
  # both Deployments.
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.dreamhost.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "1"
  EMAIL_HOST_USER: "dheeraj@dheerajchand.com"
  FROM_EMAIL: "dheeraj@dheerajchand.com"
  REPLY_TO_EMAIL: "dheeraj.chand@gmail.com"
