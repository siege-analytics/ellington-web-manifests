apiVersion: apps/v1
kind: Deployment
metadata:
  name: ellington-web
  namespace: ellington
  labels:
    app: ellington-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ellington-web
  template:
    metadata:
      labels:
        app: ellington-web
    spec:
      containers:
        - name: web
          # Image produced by the Tekton sites-build-bake Task from
          # docker-bake.hcl at the ellington-web repo root. The
          # production deployment tracks :develop: that's the trunk
          # we ship from (main is downstream of develop per project
          # workflow). Pinning :develop means each rollout pulls the
          # newest build for that branch. See ellington-web#75 — when
          # this was :latest, the Tekton build pushed :develop only
          # for develop-branch refs, leaving :latest stale and
          # production running months-old code.
          image: localhost:32000/ellington-web:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          # First-start runs `manage.py migrate` + collectstatic in the
          # entrypoint; give it room. Probe `/admin/login/` because Django
          # without a urlpatterns root returns 404 at `/`, but admin URLs
          # are always live since grappelli + admin are installed.
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: ellington-web-config
            - secretRef:
                name: ellington-web-postgres
            - secretRef:
                name: ellington-web-email
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
