apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ellington-web
  namespace: ellington
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ellington.siegeanalytics.com`)
      # Cluster convention: every public IngressRoute routes through
      # authentik-forwardauth (see electinfo/* IngressRoutes for the
      # canonical pattern). Authentik must have an Application +
      # Provider configured for this hostname before traffic can flow;
      # see README.md "Authentik configuration" for the operator step.
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik
      priority: 10
      services:
        - kind: Service
          name: ellington-web
          namespace: ellington
          port: 8080
  tls:
    secretName: ellington-tls
