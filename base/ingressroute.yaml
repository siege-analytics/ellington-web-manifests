apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ellington-web
  namespace: ellington
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ellington.siegeanalytics.com`)
      # Authentik forwardauth intentionally NOT applied here (see #14):
      # web traffic reaches Django without an SSO gate. The Authentik
      # Application + ProxyProvider + Outpost binding remain in place,
      # so this is reversible by a one-line restore of the middlewares
      # block; nothing in Authentik was destroyed.
      priority: 10
      services:
        - kind: Service
          name: ellington-web
          namespace: ellington
          port: 8080
  tls:
    secretName: ellington-tls
